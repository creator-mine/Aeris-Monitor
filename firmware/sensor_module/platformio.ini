[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    claws/BH1750@^1.3.0
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit SCD30
    adafruit/Adafruit INA219
    ; BME680: raw driver + Bosch BSEC2 (IAQ). BSEC2 ships a prebuilt
    ; libalgobsec.a; its extra_script maps every RISC-V ESP32 (C3/C6/...)
    ; to the official C3 build, so the C6 module links as well.
    https://github.com/boschsensortec/Bosch-BME68x-Library.git#v1.3.40408
    https://github.com/boschsensortec/Bosch-BSEC2-Library.git#1.10.2610

lib_ldf_mode = deep+

; Shared sensor drivers (see ../shared/sensor_modules)
lib_extra_dirs = ../shared

build_flags =
    -DCORE_DEBUG_LEVEL=3
