; IoT Modular System - Main Controller
; Supported boards:
;   [env:esp32-c3]  ESP32-C3 (LOLIN C3 mini) - 4 MB flash, no PSRAM
;   [env:esp32-s3]  ESP32-S3 N16R8 devkit - 16 MB flash, 8 MB Octal PSRAM

; ---- ESP32-C3 (default) ----
[env:esp32-c3]
platform = espressif32@6.5.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Libraries
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME680 Library@^2.0.4
    claws/BH1750@^1.3.0
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.0
    me-no-dev/AsyncTCP@1.1.1
    me-no-dev/ESPAsyncWebServer@1.2.4

; LDF mode
lib_ldf_mode = deep+

; Shared sensor drivers (see ../shared/sensor_modules)
lib_extra_dirs = ../shared

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_EVENT_RUNNING_CORE=1

; Partition table (default = dual OTA slots app0/app1, required for OTA updates)
board_build.partitions = default.csv

; ---- ESP32-S3 N16R8 (16 MB flash / 8 MB Octal PSRAM) ----
; Built on the same platform/toolchain as the C3 (keeps lib_deps compatible:
; AsyncTCP 1.1.1 + ESPAsyncWebServer 1.2.4 are core-2.x era and would break on
; a core-3.x fork). The N16R8 devkit is emulated with esp32-s3-devkitc-1 plus:
;   16 MB flash, 8 MB OPI PSRAM (memory_type qio_opi), flash 80 MHz qio,
;   dual-OTA partition table default_16MB.csv, -DBOARD_HAS_PSRAM.
[env:esp32-s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; Libraries
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME680 Library@^2.0.4
    claws/BH1750@^1.3.0
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.0
    me-no-dev/AsyncTCP@1.1.1
    me-no-dev/ESPAsyncWebServer@1.2.4

; LDF mode
lib_ldf_mode = deep+

; Shared sensor drivers (see ../shared/sensor_modules)
lib_extra_dirs = ../shared

; Build flags (board identity, pins, OTA paths for this device type).
; All of these override the #ifndef-guarded defaults in include/config.h.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_EVENT_RUNNING_CORE=1

    ; Device identity
    -DDEVICE_ID="\"esp32s3_001\""
    -DDEVICE_NAME="\"Main Controller S3\""
    -DDEVICE_TYPE="\"esp32s3\""
    -DMQTT_CLIENT_ID="\"esp32s3_main\""

    ; ESP32-S3 pin mapping (pins free of flash/PSRAM/strapping/USB):
    ;   GPIO0/GPIO3/GPIO45/GPIO46 = strapping pins
    ;   GPIO19/GPIO20            = native USB
    ;   GPIO26-37                = octal PSRAM / flash (modulo internal)
    ; I2C: SDA=8, SCL=9
    -DI2C_SDA=8
    -DI2C_SCL=9
    ; UART1 bridge to sensor modules
    -DUART_RX=4
    -DUART_TX=5
    ; SD card chip select (SPI default SCK=12 / MISO=11 / MOSI=13)
    -DSD_CS=10

    ; Per-device OTA artifacts (see deploy/fw.ps1)
    -DOTA_FW_PATH="\"/fw/main_esp32-s3.bin\""
    -DOTA_VERSION_PATH="\"/fw/version-esp32-s3.json\""