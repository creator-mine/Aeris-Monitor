; Aeris Monitor - Main Controller
; Supported boards:
;   [env:esp32-c3]  ESP32-C3 (LOLIN C3 mini) - 4 MB flash, no PSRAM
;   [env:esp32-c6]  ESP32-C6 DevKitC-1 (N16) - 16 MB flash, controller build
;   [env:esp32-s3]  ESP32-S3 N16R8 devkit - 16 MB flash, 8 MB Octal PSRAM

; ---- ESP32-C3 (default) ----
; Uses the same current platform (arduino core 3.x) as the S3 env; the S3
; board proved that the old espressif32@6.5.0 stack does not work reliably
; here, and it pins a core-2.x framework that is no longer installed.
[env:esp32-c3]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Libraries
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME680 Library@^2.0.4
    claws/BH1750@^1.3.0
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit SCD30
    adafruit/Adafruit INA219
    bblanchon/ArduinoJson@^7.0.0
    me-no-dev/AsyncTCP@^3.0.0
    me-no-dev/ESPAsyncWebServer@^3.0.0

; LDF mode
lib_ldf_mode = deep+

; Shared sensor drivers (see ../shared/sensor_modules)
lib_extra_dirs = ../shared

; Adds the framework Network include path portably (no absolute user path).
extra_scripts = pre:scripts/add_network_include.py

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_EVENT_RUNNING_CORE=1

; Partition table: dual 1.875 MB OTA slots (SPIFFS removed — unused).
; The stock default.csv (1280 KB apps) no longer fits on 4 MB flash.
board_build.partitions = partitions_c3_ota.csv

; ---- ESP32-C6 (controller, 16 MB flash) ----
; The C6 is also used as a sensor module in firmware/sensor_module, but this
; environment builds the full controller: Wi-Fi, MQTT/TLS, web server, SD log,
; relay and OTA. It intentionally identifies itself as a controller.
[env:esp32-c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Targets a 16 MB C6 module (N16). The stock dual-OTA layout gives two
; 6.25 MB app slots (SPIFFS is unused but kept as part of the table).
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Libraries
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME680 Library@^2.0.4
    claws/BH1750@^1.3.0
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit SCD30
    adafruit/Adafruit INA219
    bblanchon/ArduinoJson@^7.0.0
    me-no-dev/AsyncTCP@^3.0.0
    me-no-dev/ESPAsyncWebServer@^3.0.0

; LDF mode
lib_ldf_mode = deep+

; Shared sensor drivers (see ../shared/sensor_modules)
lib_extra_dirs = ../shared

; Adds the framework Network include path portably (no absolute user path).
extra_scripts = pre:scripts/add_network_include.py

; Build flags (board identity, pins, OTA paths for this device type).
; C6 is single-core, so the event task stays on core 0 (framework default).
build_flags =
    -DCORE_DEBUG_LEVEL=3

    ; The desktop app talks to the board over its native USB port, so Serial
    ; has to be the USB-Serial/JTAG CDC interface (same as the C3 mini board).
    ; The stock C6 board manifest leaves these unset, which makes Serial a
    ; hardware UART and CMD:* never reaches the host.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; Device identity: a controller, not the C6 sensor module.
    -DDEVICE_ID="\"esp32c6_001\""
    -DDEVICE_NAME="\"Main Controller C6\""
    -DDEVICE_TYPE="\"esp32c6\""
    -DMQTT_CLIENT_ID="\"esp32c6_main\""

    ; ESP32-C6 pin mapping (avoids strapping/USB/RGB pins 4/5/8/9/12/13):
    ; I2C: SDA=6, SCL=7
    -DI2C_SDA=6
    -DI2C_SCL=7
    ; UART1 bridge to sensor modules (matches the C6 module's 4/5 wiring)
    -DUART_RX=4
    -DUART_TX=5
    ; SD card chip select (SPI default SCK=21 / MISO=20 / MOSI=19)
    -DSD_CS=10
    ; Relay / actuator output, active HIGH (same convention as C3)
    -DRELAY_PIN=3

    ; Per-device OTA artifacts (see deploy/fw.ps1)
    -DOTA_FW_PATH="\"/fw/main_esp32-c6.bin\""
    -DOTA_VERSION_PATH="\"/fw/version-esp32-c6.json\""

; ---- ESP32-S3 N16R8 (16 MB flash / 8 MB Octal PSRAM) ----
; IMPORTANT: This board (S3 rev0.2 + OPI PSRAM) does NOT boot with the old
; espressif32@6.5.0 platform (arduino core 2.0.x / IDF 4.4 bootloader) - it
; silently loops at rst:0x3. It ONLY boots with the current espressif32
; platform (arduino core 3.3.11 / IDF 5.5.5, same stack as Arduino IDE).
; Because of that the S3 env uses `platform = espressif32` (no pin) and the
; core-3.x forks of the async libs. The N16R8 devkit is emulated with
; esp32-s3-devkitc-1 plus:
;   16 MB flash, 8 MB OPI PSRAM (memory_type qio_opi), flash 80 MHz qio,
;   dual-OTA partition table default_16MB.csv, -DBOARD_HAS_PSRAM.
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; Libraries
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME680 Library@^2.0.4
    claws/BH1750@^1.3.0
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit SCD30
    adafruit/Adafruit INA219
    bblanchon/ArduinoJson@^7.0.0
    me-no-dev/AsyncTCP@^3.0.0
    me-no-dev/ESPAsyncWebServer@^3.0.0

; LDF mode
lib_ldf_mode = deep+

; Shared sensor drivers (see ../shared/sensor_modules)
lib_extra_dirs = ../shared

; Adds the framework Network include path portably (no absolute user path).
extra_scripts = pre:scripts/add_network_include.py

; Build flags (board identity, pins, OTA paths for this device type).
; All of these override the #ifndef-guarded defaults in include/config.h.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_EVENT_RUNNING_CORE=1

    ; The desktop app configures the board over its native USB port, so Serial
    ; has to be the USB-Serial/JTAG CDC interface. The S3 board manifest leaves
    ; these unset (Serial = UART0), which makes CMD:* unreachable over USB.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; No relay wired on this board: keep the output disabled.
    -DRELAY_PIN=-1

    ; Device identity
    -DDEVICE_ID="\"esp32s3_001\""
    -DDEVICE_NAME="\"Main Controller S3\""
    -DDEVICE_TYPE="\"esp32s3\""
    -DMQTT_CLIENT_ID="\"esp32s3_main\""

    ; ESP32-S3 pin mapping (pins free of flash/PSRAM/strapping/USB):
    ;   GPIO0/GPIO3/GPIO45/GPIO46 = strapping pins
    ;   GPIO19/GPIO20            = native USB
    ;   GPIO26-37                = octal PSRAM / flash (modulo internal)
    ; I2C: SDA=8, SCL=9
    -DI2C_SDA=8
    -DI2C_SCL=9
    ; UART1 bridge to sensor modules
    -DUART_RX=4
    -DUART_TX=5
    ; SD card chip select (SPI default SCK=12 / MISO=11 / MOSI=13)
    -DSD_CS=10

    ; Per-device OTA artifacts (see deploy/fw.ps1)
    -DOTA_FW_PATH="\"/fw/main_esp32-s3.bin\""
    -DOTA_VERSION_PATH="\"/fw/version-esp32-s3.json\""