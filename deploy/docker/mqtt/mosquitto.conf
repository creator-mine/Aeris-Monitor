# Aeris Monitor — mosquitto configuration (self-hosted).
# Base config: plain MQTT for devices (1883) + WebSockets for the app (9001).
# The TLS-terminated WebSocket listener (9002, for the browser live panel) is
# appended at start-up by docker-entrypoint.sh ONLY when certificates are
# present in /mosquitto/certs (avoids mosquitto refusing to start otherwise).

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stderr

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

max_connections 32
message_size_limit 1048576
