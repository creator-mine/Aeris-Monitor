# Aeris Monitor — mosquitto configuration (self-hosted).
# Base config: plain MQTT (1883) and WebSockets (9001). docker-compose
# publishes them on loopback only for local diagnostics. Devices connect to
# 8883 (MQTT over TLS); browsers use 9002 (wss). Both TLS listeners are
# appended at start-up by docker-entrypoint.sh ONLY when certificates are
# present in /mosquitto/certs (avoids mosquitto refusing to start otherwise).

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stderr

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

max_connections 32
message_size_limit 1048576
