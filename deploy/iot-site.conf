# Aeris Monitor — host nginx vhost for spe4naz.online.
#
# Production layout: a host nginx owns :80/:443 and serves both this site and
# any other vhost (e.g. shorkey.online). The Docker IoT stack publishes its
# web container on 127.0.0.1:8080 only, and TLS terminates here.
#
# Install:
#   cp deploy/iot-site.conf /etc/nginx/sites-available/spe4naz.conf
#   ln -sf /etc/nginx/sites-available/spe4naz.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Certificate: /etc/letsencrypt/live/spe4naz.online (host certbot).

server {
    listen 80;
    listen [::]:80;
    server_name spe4naz.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 on the TLS socket. This server runs nginx 1.25.1+, so the modern
    # `http2 on` directive is used (same as the shorkey.online vhost, which
    # shares the :443 socket).
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name spe4naz.online;

    ssl_certificate     /etc/letsencrypt/live/spe4naz.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spe4naz.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upstream is the Docker `web` container (nginx serving the site, OTA
    # files, /app and /wiki, proxying /api and /panel to the server).
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE (/api/v1/stream) must not be buffered or timed out early.
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
