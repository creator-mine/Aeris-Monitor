analyzer:
  exclude:
    - build/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - android/**
    # Vendored plugin copy (see pubspec dependency_overrides); its example/
    # app is not part of this project and does not need to analyze.
    - third_party/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: false
    prefer_single_quotes: true
