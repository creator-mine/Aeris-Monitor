name: iot_modular_app
description: Modular IoT System Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Network
  dio: ^5.4.0
  mqtt_client: ^10.2.0
  web_socket_channel: ^2.4.5
  
  # Serial (USB COM port for local device setup)
  flutter_libserialport: ^0.6.0
  libserialport: ^0.3.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Firmware
  crypto: ^3.0.3
  file_picker: ^6.1.1
  
  # UI
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1
  intl: ^0.19.0
  
  # Utils
  equatable: ^2.0.5
  uuid: ^4.2.1
  path: ^1.8.0
  image_picker: ^1.0.4
  url_launcher: ^6.3.2
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
