name: aeris
description: Aeris Monitor — modular environmental monitoring
publish_to: 'none'
version: 1.4.1+31

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Network
  dio: ^5.4.0
  mqtt_client: ^10.2.0
  web_socket_channel: 3.0.3
  
  # Serial (USB COM port for local device setup)
  flutter_libserialport: ^0.6.0
  libserialport: ^0.3.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Firmware
  crypto: ^3.0.3
  file_picker: 13.3.3
  
  # UI
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1
  intl: ^0.20.3
  
  # Utils
  equatable: ^2.0.5
  uuid: ^4.2.1
  path: ^1.8.0
  url_launcher: ^6.3.2
  local_notifier: ^0.1.6
  flutter_local_notifications: ^21.0.0
  flutter_foreground_task: ^11.0.3
  path_provider: ^2.1.6
  share_plus: 13.2.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

# Local copy of flutter_libserialport with the Android platform removed:
# its Gradle file uses jcenter(), which Gradle 9 no longer supports. USB
# serial is desktop-only, so Android does not need this plugin.
dependency_overrides:
  flutter_libserialport:
    path: third_party/flutter_libserialport

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
